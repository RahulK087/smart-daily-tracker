<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#f1f5f9;
        }

        .card{
            border:none;
            border-radius:18px;
        }

    </style>

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            Smart Tracker

        </a>

        <div>

            <a href="/tasks"
               class="btn btn-outline-light me-2">

                Tasks

            </a>

            <a href="/expenses"
               class="btn btn-outline-light me-2">

                Expenses

            </a>

            <a href="/login"
               class="btn btn-outline-light me-2">

                Login

            </a>

            <a href="/signup"
               class="btn btn-danger">

                Signup

            </a>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <h2 class="mb-3">

        Productivity + Finance Overview

    </h2>

    <div class="alert alert-dark">

        <strong>Insight:</strong>

        Stay consistent with your tasks and control
        unnecessary spending to improve productivity.

    </div>

    <div class="row g-4">

        <div class="col-md-3">

            <div class="card shadow p-3">

                <h5>

                    <i class="fa-solid fa-list-check"></i>

                    Total Tasks

                </h5>

                <h2 th:text="${totalTasks}"></h2>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow p-3">

                <h5>

                    <i class="fa-solid fa-circle-check"></i>

                    Completed

                </h5>

                <h2 th:text="${completedTasks}"></h2>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow p-3">

                <h5>

                    <i class="fa-solid fa-hourglass-half"></i>

                    Pending

                </h5>

                <h2 th:text="${pendingTasks}"></h2>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow p-3">

                <h5>

                    <i class="fa-solid fa-wallet"></i>

                    Total Expense

                </h5>

                <h2>

                    ₹ <span th:text="${totalExpense}"></span>

                </h2>

            </div>

        </div>

    </div>

    <div class="card shadow p-3 mt-4">

        <h5 class="mb-3">

            Productivity Score

        </h5>

        <div class="progress"
             style="height:30px;">

            <div class="progress-bar bg-success"
                 role="progressbar"
                 th:style="'width:' + ${(completedTasks * 100) / (totalTasks == 0 ? 1 : totalTasks)} + '%'">

                <span th:text="${(completedTasks * 100) / (totalTasks == 0 ? 1 : totalTasks)} + '%'">
                </span>

            </div>

        </div>

    </div>

    <div class="row mt-4 g-4">

        <div class="col-md-6">

            <div class="card shadow p-3">

                <h4 class="mb-3">

                    <i class="fa-solid fa-chart-pie"></i>

                    Task Analytics

                </h4>

                <canvas id="taskChart"></canvas>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card shadow p-3">

                <h4 class="mb-3">

                    <i class="fa-solid fa-wallet"></i>

                    Expense Analytics

                </h4>

                <canvas id="expenseChart"></canvas>

            </div>

        </div>

    </div>

</div>

<script>

    const completedTasks =
        [[${completedTasks}]];

    const pendingTasks =
        [[${pendingTasks}]];

    const foodExpense =
        [[${foodExpense}]];

    const transportExpense =
        [[${transportExpense}]];

    const entertainmentExpense =
        [[${entertainmentExpense}]];

    const rentExpense =
        [[${rentExpense}]];

    new Chart(
        document.getElementById('taskChart'),
        {
            type: 'doughnut',

            data: {

                labels: [
                    'Completed',
                    'Pending'
                ],

                datasets: [{

                    data: [
                        completedTasks,
                        pendingTasks
                    ],

                    backgroundColor: [
                        '#22c55e',
                        '#facc15'
                    ]

                }]
            }
        }
    );

    new Chart(
        document.getElementById('expenseChart'),
        {
            type: 'bar',

            data: {

                labels: [
                    'Food',
                    'Transport',
                    'Entertainment',
                    'Rent'
                ],

                datasets: [{

                    label: 'Expenses',

                    data: [
                        foodExpense,
                        transportExpense,
                        entertainmentExpense,
                        rentExpense
                    ],

                    backgroundColor: [
                        '#22c55e',
                        '#3b82f6',
                        '#f97316',
                        '#ef4444'
                    ]

                }]
            }
        }
    );

</script>

</body>

</html>
