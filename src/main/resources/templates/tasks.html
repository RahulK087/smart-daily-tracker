<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Task Management</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body{
            background:#f1f5f9;
        }

        .card{
            border:none;
            border-radius:18px;
            backdrop-filter:blur(10px);
        }

    </style>

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            Smart Tracker

        </a>

        <div>

            <a href="/dashboard"
               class="btn btn-outline-light me-2">

                Dashboard

            </a>

            <a href="/expenses"
               class="btn btn-outline-light">

                Expenses

            </a>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <div class="card shadow p-3">

        <h2 class="text-center mb-3">

            <i class="fa-solid fa-list-check"></i>

            Task Management

        </h2>

        <form th:action="@{/saveTask}"
              th:object="${task}"
              method="post">

            <input type="hidden"
                   th:field="*{id}">

            <div class="mb-3">

                <label class="form-label">
                    Task Title
                </label>

                <input type="text"
                       th:field="*{title}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea th:field="*{description}"
                          class="form-control">
                </textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Priority
                </label>

                <select th:field="*{priority}"
                        class="form-select">

                    <option value="High">
                        High
                    </option>

                    <option value="Medium">
                        Medium
                    </option>

                    <option value="Low">
                        Low
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Due Date
                </label>

                <input type="date"
                       th:field="*{dueDate}"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Task Time
                </label>

                <input type="time"
                       th:field="*{taskTime}"
                       class="form-control">

            </div>

            <button type="submit"
                    class="btn btn-primary w-100">

                Save Task

            </button>

        </form>

    </div>

    <div class="card shadow p-3 mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h3>

                All Tasks

            </h3>

            <span class="badge bg-dark fs-6">

                Total:
                <span th:text="${tasks.size()}"></span>

            </span>

        </div>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead class="table-dark">

                <tr>

                    <th>ID</th>

                    <th>Title</th>

                    <th>Description</th>

                    <th>Priority</th>

                    <th>Due Date</th>

                    <th>Time</th>

                    <th>Status</th>

                    <th>Date</th>

                    <th>Action</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="task : ${tasks}">

                    <td th:text="${task.id}"></td>

                    <td th:text="${task.title}"></td>

                    <td th:text="${task.description}"></td>

                    <td>

                        <span th:if="${task.priority == 'High'}"
                              class="badge bg-danger">

                            High

                        </span>

                        <span th:if="${task.priority == 'Medium'}"
                              class="badge bg-warning text-dark">

                            Medium

                        </span>

                        <span th:if="${task.priority == 'Low'}"
                              class="badge bg-success">

                            Low

                        </span>

                    </td>

                    <td th:text="${task.dueDate}"></td>

                    <td th:text="${task.taskTime}"></td>

                    <td>

                        <span
                                th:classappend="${task.completed} ? 'badge bg-success' : 'badge bg-warning text-dark'"
                                th:text="${task.completed} ? 'Completed' : 'Pending'">
                        </span>

                    </td>

                    <td th:text="${task.createdDate}"></td>

                    <td>

                        <a th:href="@{/editTask/{id}(id=${task.id})}"
                           class="btn btn-warning btn-sm mb-1">

                            Edit

                        </a>

                        <a th:href="@{/completeTask/{id}(id=${task.id})}"
                           class="btn btn-success btn-sm mb-1">

                            Complete

                        </a>

                        <a th:href="@{/deleteTask/{id}(id=${task.id})}"
                           class="btn btn-danger btn-sm mb-1">

                            Delete

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<footer class="text-center mt-5 mb-3 text-muted">

    Smart Tracker App © 2026

</footer>

</body>

</html>
