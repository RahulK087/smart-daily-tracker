<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Smart Tracker</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>

        body{
            background: linear-gradient(135deg,#0f172a,#1e293b);
            color:white;
            min-height:100vh;
        }

        .hero{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            flex-direction:column;
        }

        .hero h1{
            font-size:65px;
            font-weight:bold;
        }

        .hero p{
            font-size:20px;
            color:#cbd5e1;
            margin-top:15px;
        }

        .guest-link{
            margin-top:20px;
            font-size:14px;
            color:#94a3b8;
            text-decoration:none;
        }

        .guest-link:hover{
            color:white;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="hero">

        <h1>
            Smart Daily Tracker
        </h1>

        <p>
            Manage Tasks, Expenses & Productivity Easily
        </p>

        <div class="mt-4">

            <a href="/login"
               class="btn btn-light btn-lg me-3">

                Login

            </a>

            <a href="/signup"
               class="btn btn-outline-light btn-lg">

                Signup

            </a>

        </div>

        <a href="/dashboard"
           class="guest-link">

            Continue without account

        </a>

    </div>

</div>

</body>

</html>
