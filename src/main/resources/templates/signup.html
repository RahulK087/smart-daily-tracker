<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Signup</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>

        .card{
            border:none;
            border-radius:18px;
            backdrop-filter:blur(10px);
        }

        body{
            background:#f1f5f9;
        }

    </style>
</head>

<body class="bg-dark">

<div class="container">

    <div class="row justify-content-center align-items-center"
         style="height:100vh;">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">

                    Signup

                </h2>

                <form th:action="@{/register}"
                      th:object="${user}"
                      method="post">

                    <div class="mb-3">

                        <label>Name</label>

                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Email</label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input type="password"
                               th:field="*{password}"
                               class="form-control"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-dark w-100">

                        Signup

                    </button>

                </form>
                <div class="text-center mt-3">

                    Already have an account?

                    <a href="/login">

                        Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
